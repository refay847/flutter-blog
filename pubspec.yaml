name: blog_app
description: Professional Flutter client for the Laravel Blog API.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.5.3
  image_picker: ^1.2.0
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.5

  flutter_lints: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
